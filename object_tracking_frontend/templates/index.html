<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Tracking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <h1>Object Tracking in Video</h1>

    <!-- Form to upload video -->
    <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" id="videoUpload" name="video" accept="video/*" required>
        <button type="submit">Upload Video</button>
    </form>

    <!-- Video stream -->
    <video id="videoPlayer" controls>
        <source src="{{ url_for('video') }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Button to start tracking -->
    <button id="startTracking" disabled>Start Tracking</button>

    <!-- Button to download the tracked video -->
    <button id="downloadVideo" style="display:none;">Download Tracked Video</button>

    <div id="message"></div>

    <script>
        const uploadForm = document.getElementById("uploadForm");
        const videoPlayer = document.getElementById("videoPlayer");
        const startTrackingButton = document.getElementById("startTracking");
        const downloadButton = document.getElementById("downloadVideo");
        const messageDiv = document.getElementById("message");

        // Handle video upload
        uploadForm.addEventListener("submit", function (e) {
            e.preventDefault();

            const formData = new FormData(uploadForm);

            fetch('/start_tracking', {
                method: 'POST',
                body: formData
            }).then(response => response.json())
                .then(data => {
                    if (data.success) {
                        messageDiv.textContent = "Video uploaded successfully. Tracking started!";
                        startTrackingButton.disabled = false;
                    } else {
                        messageDiv.textContent = "Failed to upload video: " + data.message;
                    }
                });
        });

        // Handle start tracking button click
        startTrackingButton.addEventListener("click", function () {
            messageDiv.textContent = "Tracking in progress...";
        });

        // Handle download video button click
        downloadButton.addEventListener("click", function () {
            fetch('/download_video')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const videoUrl = data.video_url;
                        const a = document.createElement('a');
                        a.href = videoUrl;
                        a.download = 'tracked_video.mp4';
                        a.click();
                    } else {
                        alert(data.message);
                    }
                });
        });

        // Show download button once the tracking is complete
        const checkTrackingStatus = setInterval(function () {
            fetch('/download_video')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        downloadButton.style.display = 'block';
                        clearInterval(checkTrackingStatus);
                    }
                });
        }, 2000);
    </script>
</body>

</html>
